<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" role="img" aria-labelledby="t">
  <title id="t">Letter Rack icon, direction C, 16 px hand-tuned (draft)</title>
  <!-- Pixel-grid version: a 2 px stem, a 1 px foot, the arm as a 2 px block, and the double rule as one amber row. -->
  <rect width="16" height="16" rx="3" fill="#F5F0E6"/>
  <g fill="#2B261F">
    <rect x="5" y="4" width="3" height="1"/>
    <rect x="6" y="4" width="2" height="7"/>
    <rect x="5" y="11" width="5" height="1"/>
    <rect x="8" y="5" width="1" height="1"/>
    <rect x="9" y="4" width="2" height="2"/>
  </g>
  <rect x="4" y="13" width="8" height="1" fill="#A86A12"/>
</svg>
